<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Study Buddy - Notes to Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>📚 AI Study Buddy</h1>
    <p class="subtitle">Paste notes or upload a PDF, choose your settings, and get an instant quiz!</p>

    <textarea id="notesInput" placeholder="Paste your study notes here..."></textarea>

    <div class="file-upload">
      <label for="pdfInput" class="file-label">📄 Or upload a PDF</label>
      <input type="file" id="pdfInput" accept="application/pdf">
      <span id="pdfFileName"></span>
    </div>

    <div class="settings-row">
      <div class="setting">
        <label for="numQuestions">Number of Questions</label>
        <input type="number" id="numQuestions" value="5" min="1" max="15">
      </div>

      <div class="setting">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
    </div>

    <button id="generateBtn">Generate Quiz</button>

    <div id="loading" class="hidden">⏳ Generating quiz, please wait...</div>

    <div id="quizContainer"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
